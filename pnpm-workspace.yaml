packages:
  - client
  - server
  - e2e

allowBuilds:
  argon2: set this to true or false
  esbuild: set this to true or false

# Flat npm-style node_modules — the project path exceeds Windows MAX_PATH
# (260 chars) under the .pnpm layout, which makes spawned binaries (esbuild)
# fail with ENOENT. Hoisted paths stay under the limit.
nodeLinker: hoisted

# Don't run `pnpm install` before every script — this tree was moved with a
# pre-built node_modules; the check tries to prune packages and fails on
# build-script approval, which broke the Python service launches.
verifyDepsBeforeRun: false
