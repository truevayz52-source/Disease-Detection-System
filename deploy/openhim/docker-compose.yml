# Local OpenHIM stack for the DDS regional bridge.
#   mongo       — OpenHIM datastore
#   openhim     — OpenHIM Core (API :8080 self-signed, HTTP router :5001)
#   echo        — channel target that accepts the MeasureReport and returns 200
#   console     — admin UI at http://localhost:9090 (API calls go to :8080)
#
#   docker compose -f deploy/openhim/docker-compose.yml up -d
#
# First boot creates API user root@openhim.org / openhim-password.
# Channel + client are provisioned by deploy/openhim/provision.ps1.

services:
  mongo:
    image: mongo:6
    container_name: dds-openhim-mongo
    restart: unless-stopped
    volumes:
      - openhim-mongo:/data/db

  openhim:
    image: jembi/openhim-core:latest
    container_name: dds-openhim-core
    restart: unless-stopped
    depends_on:
      - mongo
      - echo
    environment:
      mongo_url: mongodb://dds-openhim-mongo/openhim-dev
      mongo_atnaUrl: mongodb://dds-openhim-mongo/openhim-dev
      api_authenticationTypes: '["token","basic"]'
      # DDS regional bridge authenticates with a custom-token client
      authentication_enableCustomTokenAuthentication: "true"
    ports:
      - "8080:8080"   # API (https, self-signed)
      - "5000:5000"   # TCP/MLLP router
      - "5001:5001"   # HTTP router  ← OPENHIM_BASE_URL=http://localhost:5001
      - "5005:5005"   # HTTPS router

  echo:
    image: ealen/echo-server:latest
    container_name: dds-openhim-echo
    restart: unless-stopped
    environment:
      PORT: 80
      ENABLE__ENVIRONMENT: "false"

  console:
    image: jembi/openhim-console:latest
    container_name: dds-openhim-console
    restart: unless-stopped
    depends_on:
      - openhim
    environment:
      OPENHIM_MEDIATOR_URL: https://localhost:8080
      OPENHIM_API_URL: https://localhost:8080
      PG_CONSOLE_PORT: 80
    ports:
      - "9090:80"

volumes:
  openhim-mongo:
